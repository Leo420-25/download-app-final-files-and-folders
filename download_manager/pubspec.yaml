name: download_manager
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  sqflite: ^2.3.0
  path: ^1.9.1
  file_picker: 12.3.0 # Changed from ^12.2.0 to avoid the breaking changes
  sqflite_common_ffi: ^2.4.2+1
  sqlite3_flutter_libs: ^0.5.24
  desktop_drop: ^0.8.4
  connectivity_plus: ^7.3.1
  flutter_local_notifications: ^22.3.0
  crypto: ^3.0.7
  qr_flutter: ^4.1.0
  # Removed mobile_scanner (no Windows support)
  # Added simple_barcode_scanner (supports Windows, Web, iOS, Android)
  simple_barcode_scanner: ^0.6.1 
  nsd: ^4.0.0
  permission_handler: ^13.0.2
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  device_info_plus: 13.2.0
  flutter_foreground_task: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  msix: ^3.16.7

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 48

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    # IMPORTANT: Uncomment the line below ONLY AFTER you download the Windows 
    # aria2c.exe file and physically place it inside your "assets" folder.
    # - assets/aria2c.exe

msix_config:
  display_name: Tasky
  publisher_display_name: Mohith
  identity_name: Tasky.DownloadManager
  msix_version: 1.0.0.0
  logo_path: assets/icon/app_icon.png